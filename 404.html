<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found</title>
<script>
  // GitHub Pages matches project names case-sensitively (/VaultBook works, /vaultbook does not).
  // Any address that misses a project lands here; send it to the correctly-cased project,
  // keeping the rest of the path, the query string and the #hash.
  (function () {
    var projects = ["VaultBook", "ledgerline", "statement-studio8.13", "2qbo", "QBO-V3.0", "qboai", "hms", "acc692"];
    var parts = location.pathname.split("/");
    var first = decodeURIComponent(parts[1] || "");
    for (var i = 0; i < projects.length; i++) {
      var p = projects[i];
      if (first.toLowerCase() === p.toLowerCase() && first !== p) {
        parts[1] = p;
        var path = parts.join("/");
        if (parts.length === 2) path += "/";
        location.replace(path + location.search + location.hash);
        return;
      }
    }
  })();
</script>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; color: #222; display: grid; place-items: center; min-height: 90vh; margin: 0; }
  main { text-align: center; padding: 1rem; }
  a { color: #2452C7; }
</style>
</head>
<body>
<main>
  <h1>Page not found</h1>
  <p>Looking for VaultBook? <a href="/VaultBook/">Open VaultBook</a></p>
</main>
</body>
</html>
